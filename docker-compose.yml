# ============================================================
# summer-camp 演示环境：MySQL + 后端 API
# ============================================================
# 前端 ui/dist 不在本文件里：用宿主机 Nginx 托管静态文件，并把
#   /user  /form  /healthz
# 反代到 127.0.0.1:3000（容器对外暴露的端口）。
#
# 常用命令：
#   docker compose up -d --build      # 首次启动 / 改了后端代码后
#   docker compose logs -f server     # 看日志
#   docker compose down               # 停止，保留 MySQL 数据
#   docker compose down -v            # 停止并清空 MySQL 数据
#
# 注意：NODE_ENV=production 时后端会给 Cookie 加 Secure 标记，浏览器只在
# HTTPS 下保存。纯 HTTP 演示请改成 NODE_ENV=development（见 server.environment）。
# ============================================================

name: summer-camp

# 后端镜像：migrate 和 server 复用同一份构建结果
x-backend: &backend
  build:
    context: ./server
    dockerfile: Dockerfile
  image: summer-camp-server:demo

# 容器内一律用服务名 mysql，不能沿用 server/.env 里的 127.0.0.1
x-db-env: &db-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  # demo 用 root；正式环境建议单独建库账号并显式 GRANT
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpass}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-summer_camp}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-summer_camp}
      TZ: Asia/Shanghai
    # 默认不映射端口：宿主机 3306 通常已被本地 MySQL 占用，而且 demo 只用
    # 容器内网互通就够。确实需要外部客户端连接时打开下面两行。
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # 一次性迁移任务：跑完即退出。server 会等它成功后才启动，
  # 否则全新数据卷上 BOOTSTRAP_ON_START 会因缺表而启动失败。
  migrate:
    <<: *backend
    restart: "no"
    env_file:
      - ./server/.env
    environment:
      <<: *db-env
      NODE_ENV: production
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy

  server:
    <<: *backend
    restart: unless-stopped
    # 让 docker 充当 PID 1，信号才能真正传给 node
    init: true
    env_file:
      # 敏感配置（JWT_SECRET / OTP_SECRET / SMTP_* / BOOTSTRAP_*）都在这里
      - ./server/.env
    environment:
      # environment 优先级高于 env_file，用容器内可用的值覆盖宿主值
      <<: *db-env
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      # 浏览器实际访问的地址；换域名/端口时改这里（或写进项目根目录的 .env）
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /healthz 内部会 ping 数据库，DB 挂了这里会变 unhealthy
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql-data:
